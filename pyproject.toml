[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopa"
version = "1.0.0"
description = "Scopa AI - Reinforcement Learning agent for the Italian card game Scopa"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Gio"}
]
keywords = ["scopa", "ai", "reinforcement-learning", "card-game", "ppo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch",
    "numpy",
    "stable-baselines3",
    "sb3-contrib",
    "gymnasium",
    "pygame",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[project.scripts]
scopa-train = "scopa.training.train:main"
scopa-train-parallel = "scopa.training.train_parallel:main"
scopa-play = "scopa.gui:main"
scopa-visual = "scopa.cli.visual_match:main"
scopa-plot = "scopa.training.visualization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.png"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
